apiVersion: apps/v1
kind: Deployment
metadata:
  name: agent-skills-catalog
  namespace: default
  labels:
    app.kubernetes.io/part-of: multi-persona-fleet
    app: agent-skills-catalog
spec:
  replicas: 1
  selector:
    matchLabels:
      app: agent-skills-catalog
  template:
    metadata:
      labels:
        app: agent-skills-catalog
    spec:
      containers:
      - name: catalog-service
        image: ghcr.io/example/agent-skills-catalog:latest
        imagePullPolicy: IfNotPresent
        command: ["/skill-loader"]
        args: ["-catalog", "/catalog", "-serve"]
        ports:
        - containerPort: 8080
          name: http
        livenessProbe:
          httpGet:
            path: /healthz
            port: 8080
          initialDelaySeconds: 2
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /healthz
            port: 8080
          initialDelaySeconds: 2
          periodSeconds: 10
        resources:
          requests:
            cpu: "50m"
            memory: "64Mi"
          limits:
            cpu: "100m"
            memory: "128Mi"
