apiVersion: v1
kind: ServiceAccount
metadata:
  name: sandbox-security
  namespace: default
  labels:
    agent.x-k8s.io/persona: security-auditor
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: sandbox-security-reader
  labels:
    agent.x-k8s.io/persona: security-auditor
rules:
# Security Auditor needs RBAC inspection, pod security contexts, and network policies
- apiGroups: [""]
  resources: ["pods", "pods/status", "namespaces", "serviceaccounts"]
  verbs: ["get", "list", "watch"]
- apiGroups: ["apps"]
  resources: ["deployments", "statefulsets", "daemonsets"]
  verbs: ["get", "list", "watch"]
- apiGroups: ["rbac.authorization.k8s.io"]
  resources: ["clusterroles", "clusterrolebindings", "roles", "rolebindings"]
  verbs: ["get", "list", "watch"]
- apiGroups: ["networking.k8s.io"]
  resources: ["networkpolicies"]
  verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: sandbox-security-reader-binding
  labels:
    agent.x-k8s.io/persona: security-auditor
subjects:
- kind: ServiceAccount
  name: sandbox-security
  namespace: default
roleRef:
  kind: ClusterRole
  name: sandbox-security-reader
  apiGroup: rbac.authorization.k8s.io
