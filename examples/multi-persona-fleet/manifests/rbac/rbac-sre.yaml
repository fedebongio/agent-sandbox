apiVersion: v1
kind: ServiceAccount
metadata:
  name: sandbox-sre
  namespace: default
  labels:
    agent.x-k8s.io/persona: sre-observer
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: sandbox-sre-reader
  labels:
    agent.x-k8s.io/persona: sre-observer
rules:
# SRE needs workload status, events, networking endpoints, and node health
- apiGroups: [""]
  resources: ["pods", "pods/status", "services", "endpoints", "events", "nodes"]
  verbs: ["get", "list", "watch"]
- apiGroups: ["apps"]
  resources: ["deployments", "statefulsets", "daemonsets", "replicasets"]
  verbs: ["get", "list", "watch"]
- apiGroups: ["networking.k8s.io"]
  resources: ["ingresses"]
  verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: sandbox-sre-reader-binding
  labels:
    agent.x-k8s.io/persona: sre-observer
subjects:
- kind: ServiceAccount
  name: sandbox-sre
  namespace: default
roleRef:
  kind: ClusterRole
  name: sandbox-sre-reader
  apiGroup: rbac.authorization.k8s.io
