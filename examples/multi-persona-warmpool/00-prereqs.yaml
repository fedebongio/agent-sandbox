apiVersion: v1
kind: Namespace
metadata:
  name: multi-persona-demo
---
# ---------------------------------------------------------------------------
# Trust boundary A: observers. Read-only on the cluster.
# Several personas (SRE, security, FinOps) share this identity, so they can
# share ONE warm pool.
# ---------------------------------------------------------------------------
apiVersion: v1
kind: ServiceAccount
metadata:
  name: agent-observer
  namespace: multi-persona-demo
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: multi-persona-observer
rules:
  - apiGroups: [""]
    resources: ["pods", "nodes", "events", "services", "namespaces"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["apps"]
    resources: ["deployments", "statefulsets", "daemonsets"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["metrics.k8s.io"]
    resources: ["pods", "nodes"]
    verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: multi-persona-observer
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: multi-persona-observer
subjects:
  - kind: ServiceAccount
    name: agent-observer
    namespace: multi-persona-demo
---
# ---------------------------------------------------------------------------
# Trust boundary B: remediator. Can actually change things.
#
# This identity CANNOT share pool A. serviceAccountName is part of the pod
# spec, which is stamped from the SandboxTemplate before any claim exists —
# so a pool has exactly one identity. Personas that differ in *permissions*
# need their own pool; personas that differ only in *behaviour* do not.
# ---------------------------------------------------------------------------
apiVersion: v1
kind: ServiceAccount
metadata:
  name: agent-remediator
  namespace: multi-persona-demo
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: multi-persona-remediator
rules:
  - apiGroups: [""]
    resources: ["pods", "nodes", "events", "services", "namespaces"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["delete"] # restart a wedged pod
  - apiGroups: ["apps"]
    resources: ["deployments", "statefulsets"]
    verbs: ["get", "list", "watch", "patch"] # scale / roll back
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: multi-persona-remediator
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: multi-persona-remediator
subjects:
  - kind: ServiceAccount
    name: agent-remediator
    namespace: multi-persona-demo
