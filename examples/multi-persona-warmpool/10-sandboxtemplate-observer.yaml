# Pool A — the observer pool. ONE template, MANY personas.
#
# Everything here is stamped into every warm spare before any claim exists:
# the image, the ServiceAccount, the volumes, the full persona catalogue.
# Nothing below varies per persona. The only thing a claim contributes is a
# label, projected into the pod through the downwardAPI volume.
apiVersion: extensions.agents.x-k8s.io/v1beta1
kind: SandboxTemplate
metadata:
  name: observer-pool
  namespace: multi-persona-demo
spec:
  # Reject claims that carry env or volumeClaimTemplates. Such claims would
  # BYPASS the warm pool and cold-start (see 40-antipattern-env.yaml for what
  # happens when this is set to Allowed instead). Disallowed turns a silent
  # performance regression into a loud error.
  envVarsInjectionPolicy: Disallowed
  volumeClaimTemplatesPolicy: Disallowed

  networkPolicyManagement: Unmanaged

  podTemplate:
    # IMPORTANT: do NOT pre-declare sandbox.users.io/persona here.
    # The controller enforces a no-override rule — a claim may ADD a label but
    # never override one the template already defines. A "sensible default"
    # such as persona: unassigned makes EVERY claim fail with:
    #   metadata override conflict: label "sandbox.users.io/persona" is
    #   defined in template with value "unassigned", but claim requests "..."
    spec:
      serviceAccountName: agent-observer
      restartPolicy: OnFailure
      securityContext:
        runAsUser: 10000
        runAsGroup: 10000
        fsGroup: 10000
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: agent
          image: busybox:1.36
          command: ["/bin/sh", "/opt/bin/activate-persona.sh"]
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
          volumeMounts:
            # The per-claim persona arrives here, and is REFRESHED IN PLACE by
            # the kubelet when the claim changes the label. This is the whole
            # trick: no pod-spec mutation, so no restart.
            - name: podinfo
              mountPath: /etc/podinfo
              readOnly: true
            - name: persona-catalog
              mountPath: /opt/personas
              readOnly: true
            - name: activator
              mountPath: /opt/bin
              readOnly: true
            - name: active
              mountPath: /opt/active
      volumes:
        - name: podinfo
          downwardAPI:
            items:
              - path: "labels"
                fieldRef:
                  fieldPath: metadata.labels
        # Every pod carries the FULL catalogue; the label selects which entry
        # is active. Identical across the pool, so spares stay fungible.
        - name: persona-catalog
          configMap:
            name: persona-catalog
        - name: activator
          configMap:
            name: persona-activator
            defaultMode: 0555
        - name: active
          emptyDir: {}
