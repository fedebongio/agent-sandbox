#
# Pool B — the remediator pool.
#
# Identical to pool A in every respect EXCEPT serviceAccountName. That single
# difference is why it must be a separate pool: serviceAccountName lives in
# the pod spec, which is stamped from the template before any claim exists.
# No claim-time field can change it.
#
# Rule of thumb: personas that differ only in BEHAVIOUR share a pool.
#                Personas that differ in PERMISSIONS need their own.
apiVersion: extensions.agents.x-k8s.io/v1beta1
kind: SandboxTemplate
metadata:
  name: remediator-pool
  namespace: multi-persona-demo
spec:
  envVarsInjectionPolicy: Disallowed
  volumeClaimTemplatesPolicy: Disallowed
  networkPolicyManagement: Unmanaged
  podTemplate:
    spec:
      serviceAccountName: agent-remediator # <-- the only meaningful difference
      restartPolicy: OnFailure
      securityContext:
        runAsUser: 10000
        runAsGroup: 10000
        fsGroup: 10000
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: agent
          image: busybox:1.36
          command: ["/bin/sh", "/opt/bin/activate-persona.sh"]
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
          volumeMounts:
            - name: podinfo
              mountPath: /etc/podinfo
              readOnly: true
            - name: persona-catalog
              mountPath: /opt/personas
              readOnly: true
            - name: activator
              mountPath: /opt/bin
              readOnly: true
            - name: active
              mountPath: /opt/active
      volumes:
        - name: podinfo
          downwardAPI:
            items:
              - path: "labels"
                fieldRef:
                  fieldPath: metadata.labels
        - name: persona-catalog
          configMap:
            name: persona-catalog
        - name: activator
          configMap:
            name: persona-activator
            defaultMode: 0555
        - name: active
          emptyDir: {}
