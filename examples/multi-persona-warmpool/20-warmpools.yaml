#
# Two pools, sized by TRUST BOUNDARY rather than by persona.
#
# Pool A holds three personas' worth of demand in three fungible spares.
# Sizing per-persona instead would mean 3 pools x N spares — the combinatorial
# blow-up this example exists to avoid.
apiVersion: extensions.agents.x-k8s.io/v1beta1
kind: SandboxWarmPool
metadata:
  name: observer-pool
  namespace: multi-persona-demo
spec:
  replicas: 3
  sandboxTemplateRef:
    name: observer-pool
---
apiVersion: extensions.agents.x-k8s.io/v1beta1
kind: SandboxWarmPool
metadata:
  name: remediator-pool
  namespace: multi-persona-demo
spec:
  replicas: 1
  sandboxTemplateRef:
    name: remediator-pool
